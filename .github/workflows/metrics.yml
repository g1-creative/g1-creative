name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"      # daily at 06:00 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Main stats card ────────────────────────────────────────────────
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: g1-creative
          filename: metrics/main.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          config_theme: dark
          config_animations: yes

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15

          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 1

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          plugin_repositories: yes
          plugin_repositories_featured: g1-creative/leagueville

          plugin_code: yes
          plugin_code_lines: 12

  # ── Isometric 3D commit calendar ───────────────────────────────────
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: g1-creative
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: America/New_York
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # ── PageSpeed score for advancedrestoration.net ────────────────────
  pagespeed:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: g1-creative
          filename: metrics/pagespeed.svg
          base: ""
          config_theme: dark
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://advancedrestoration.net
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes

  # ── Recent activity feed ───────────────────────────────────────────
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: g1-creative
          filename: metrics/activity.svg
          base: ""
          config_timezone: America/New_York
          config_theme: dark
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 0
          plugin_activity_visibility: all
