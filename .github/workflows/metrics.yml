name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: g1-creative
          filename: metrics/main.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          config_animations: yes
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
            .field svg, svg .octicon { fill: #8b949e; }

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15

          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 1

          plugin_repositories: yes
          plugin_repositories_featured: g1-creative/leagueville

          plugin_code: yes
          plugin_code_lines: 12

  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: g1-creative
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: America/New_York
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # Needs secrets.PAGESPEED_TOKEN (free Google API key) or it 429s.
  pagespeed:
    runs-on: ubuntu-latest
    if: ${{ false }}   # flip to `true` once PAGESPEED_TOKEN is set
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: g1-creative
          filename: metrics/pagespeed.svg
          base: ""
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
          plugin_pagespeed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_url: https://advancedrestoration.net
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes
